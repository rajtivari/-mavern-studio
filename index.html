<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1f2"><meta name="description" content="Mavern Studio is an independent digital studio in Bengaluru building considered websites and digital experiences."><title>Mavern Studio® — Websites with intention</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Sansita+Swashed:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./src/styles.css"></head>
<body><div id="site-header"></div><main id="main-content"><div id="hero"></div><div id="philosophy"></div><div id="services"></div><div id="projects"></div><div id="pricing"></div><div id="process"></div><div id="faq"></div><div id="contact"></div></main><div id="site-footer"></div><dialog id="project-dialog" class="project-dialog"><button class="dialog-close" data-close-dialog aria-label="Close">×</button><p class="eyebrow">LET'S MAKE SOMETHING GOOD</p><h2>Tell us what you're building.</h2><p class="muted">A few details are enough to start a useful conversation.</p><form id="project-form" class="form-stack"><label>Your name<input name="name" required autocomplete="name" placeholder="Name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>What do you need?<select name="service"><option>Business website</option><option>Landing page</option><option>Portfolio</option><option>Custom web experience</option><option>Not sure yet</option></select></label><label>Project notes<textarea name="notes" rows="3" placeholder="Goals, timeline, or anything useful"></textarea></label><button class="button button-dark" type="submit">Prepare enquiry ↗</button></form></dialog><script type="module" src="./src/main.js"></script></body></html>
