<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1F1F2">
  <title>Page not found — Mavern Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sansita+Swashed:wght@600;800&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
  <style>.not-found{min-height:100vh;display:grid;place-items:center;text-align:center;padding:7rem 1.25rem 4rem}.not-found-inner{max-width:760px}.not-found-code{font:400 .75rem ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--mute);margin-bottom:22px}.not-found h1{font:300 clamp(4rem,13vw,9rem)/.9 var(--b);letter-spacing:-.075em;max-width:none;margin:0 auto 24px}.not-found p{color:var(--mute);max-width:46ch;margin:0 auto 30px}.not-found .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.not-found .actions .btn.o{background:transparent;color:var(--ink)}.nf-mark{font:800 clamp(2rem,5vw,3.5rem) var(--w);margin-bottom:34px}.nf-mark sup{font-size:.5em}</style>
</head>
<body>
<header id="hd"><div class="wrap nav">
<a class="logo" href="./" aria-label="Mavern Studio home">Mavern<sup>®</sup></a>
<nav aria-label="Main"><ul id="menu"><li><a href="./#services">Services</a></li><li><a href="./#work">Work</a></li><li><a href="./#pricing">Pricing</a></li><li><a class="btn" href="./#contact">Start a Project</a></li></ul></nav>
<a class="btn" href="./" style="display:none" id="desktop-home">Home</a>
</div></header>
<main class="not-found"><div class="not-found-inner">
<div class="nf-mark">Mavern<sup>®</sup></div>
<div class="not-found-code">ERROR 404 — PAGE NOT FOUND</div>
<h1>Wrong turn.</h1>
<p>The page you’re looking for isn’t here. It may have moved, or the link may be out of date.</p>
<div class="actions"><a class="btn" href="./">Back to home ↗</a><a class="btn o" href="./#contact">Contact the studio</a></div>
</div></main>
<script>const b=document.querySelector('#bg'),m=document.querySelector('#menu');if(b&&m)b.addEventListener('click',()=>{const o=m.classList.toggle('open');b.setAttribute('aria-expanded',String(o))});</script>
</body>
</html>
